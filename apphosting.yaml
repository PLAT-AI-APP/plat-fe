# Firebase App Hosting 설정. Vercel 배포에는 영향이 없다.
# 문서: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # 테스트 배포용 최소 사양. 트래픽이 생기면 늘린다.
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

# NEXT_PUBLIC_* 값은 빌드 때 번들에 박히므로 BUILD 가용성이 있어야 한다.
# 기본 값은 저장소의 .env.production 을 그대로 쓴다. 테스트 배포에서만 다르게 할 값만 아래에 둔다.
env:
  # 공유 미리보기·메타 기준 주소. 테스트 도메인이 정해지면 채운다.
  # - variable: NEXT_PUBLIC_SITE_URL
  #   value: https://<테스트 도메인>
  #   availability: [BUILD, RUNTIME]

  # 오류 수집(Sentry)을 켤 때만. 인증 토큰은 value 가 아니라 secret 으로 둔다.
  # - variable: SENTRY_AUTH_TOKEN
  #   secret: sentry-auth-token
  #   availability: [BUILD]
